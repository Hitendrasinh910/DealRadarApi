name: 10-Minute Price Monitor

on:
  schedule:
    # Backup fallback only (in case chain is ever manually stopped)
    - cron: '23 */2 * * *'
  workflow_dispatch:
    inputs:
      productId:
        description: 'Optional MasterProduct ID to check'
        required: false
        default: '0'

# Required so GITHUB_TOKEN can trigger the next workflow run automatically!
permissions:
  actions: write
  contents: read

concurrency:
  group: price-scraper-${{ github.event.inputs.productId || 'loop' }}
  cancel-in-progress: false

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Clean Windows bin/obj & Build for Linux
        run: |
          find . -type d \( -name "bin" -o -name "obj" \) -exec rm -rf {} +
          CSPROJ_PATH=$(find . -name "*.csproj" | head -n 1)
          echo "CSPROJ_PATH=$CSPROJ_PATH" >> $GITHUB_ENV
          dotnet build "$CSPROJ_PATH" -c Release

      - name: Install Playwright & Chromium
        run: |
          PLAYWRIGHT_SCRIPT=$(find . -path "*/bin/Release/*" -name "playwright.ps1" | head -n 1)
          pwsh "$PLAYWRIGHT_SCRIPT" install --with-deps chromium

      - name: Execute Scraper Loop
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.CONNECTION_STRING }}
          Telegram__BotToken: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          Telegram__ChatId: ${{ secrets.TELEGRAM_CHAT_ID }}
          TARGET_PRODUCT_ID: ${{ github.event.inputs.productId }}
        run: |
          # If a specific productId was clicked on the Angular Dashboard ("Check Price" button),
          # scan ONLY that product once and exit immediately!
          if [ -n "${{ github.event.inputs.productId }}" ] && [ "${{ github.event.inputs.productId }}" != "0" ]; then
            echo "Single product scan requested for ID=${{ github.event.inputs.productId }}"
            dotnet run --project "$CSPROJ_PATH" -c Release --no-build -- --cron-scan
            exit 0
          fi

          # Otherwise, run 4 cycles (every 10 minutes) and then chain the next workflow run!
          for i in 1 2 3 4; do
            echo "===================================================="
            echo "   Starting Scan Cycle $i of 4 at $(date)"
            echo "===================================================="
            dotnet run --project "$CSPROJ_PATH" -c Release --no-build -- --cron-scan || true
            
            echo "Cycle $i complete! Sleeping 10 minutes..."
            sleep 600
          done

      - name: Chain Next Run Immediately (Never Stops!)
        if: always() && (github.event.inputs.productId == '' || github.event.inputs.productId == '0')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Triggering the next continuous 10-Minute Price Monitor run on master..."
          gh workflow run price-monitor.yml --ref master
